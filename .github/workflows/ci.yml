name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-lint:
    name: test-and-lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/tutoring_scheduler_test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: tutoring_scheduler_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_SSL: 'false'
      JWT_SECRET: ci-only-development-secret-do-not-use-outside-tests
      RUN_DB_INTEGRATION_TESTS: 'true'

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tutoring_scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tutoring_scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate environment templates
        run: npm run validate:env

      - name: Check backend JavaScript syntax
        run: npm run lint

      - name: Run database migrations
        run: npm run db:migrate

      - name: Run backend tests, including PostgreSQL integration tests
        run: npm test

      - name: Build workspaces
        run: npm run build
